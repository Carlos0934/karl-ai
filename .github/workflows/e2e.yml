name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows-only: install.ps1 is the Windows installer.
  offline-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run install lifecycle E2E (pwsh)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          pwsh -NoProfile -File tests/e2e/install-lifecycle.ps1 *>&1 | Tee-Object TestResults/install-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload offline diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-windows-pwsh
          path: TestResults/

  # Linux: install.sh is POSIX sh; validated with shellcheck on Debian.
  offline-debian:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install git, CA certificates, and shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates shellcheck
      - name: Shellcheck installer and E2E
        run: shellcheck --shell=sh install.sh tests/e2e/install-lifecycle.sh
      - name: Run install lifecycle E2E (sh)
        run: sh tests/e2e/install-lifecycle.sh
      - name: Upload offline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-debian-sh
          path: TestResults/
          if-no-files-found: ignore

  # macOS: same POSIX sh contract as the Debian job.
  offline-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
      - name: Shellcheck installer and E2E
        run: shellcheck --shell=sh install.sh tests/e2e/install-lifecycle.sh
      - name: Run install lifecycle E2E (sh)
        run: sh tests/e2e/install-lifecycle.sh
      - name: Upload offline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-macos-sh
          path: TestResults/
          if-no-files-found: ignore

  live-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 2
    outputs:
      available: ${{ steps.key.outputs.available }}
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - id: key
        shell: pwsh
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:OPENCODE_API_KEY)
          "available=$available".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          if (-not $available) {
            "Live OpenCode E2E skipped: repository secret OPENCODE_API_KEY is not configured." >> $env:GITHUB_STEP_SUMMARY
          }

  # The live OpenCode test still uses pwsh on both runners; this is
  # independent of the installer platform split.
  live:
    needs: [offline-windows, offline-debian, offline-macos, live-gate]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.live-gate.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install latest OpenCode
        shell: pwsh
        run: |
          npm install --global opencode-ai@latest
          opencode --version
      - name: Run minimal live E2E
        shell: pwsh
        run: pwsh -NoProfile -File tests/e2e/opencode-minimal.ps1
      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-diagnostics-${{ runner.os }}-pwsh
          path: TestResults/
          if-no-files-found: warn
