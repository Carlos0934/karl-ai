name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows-only: install.ps1 is the Windows installer.
  offline-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run install lifecycle E2E (pwsh)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          pwsh -NoProfile -File tests/e2e/install-lifecycle.ps1 *>&1 | Tee-Object TestResults/install-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run opencode profile E2E (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/opencode-profile.ps1 *>&1 | Tee-Object TestResults/opencode-profile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload offline diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-windows-pwsh
          path: TestResults/

  # Linux: install.sh is POSIX sh; validated with shellcheck on Debian.
  offline-debian:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install git, CA certificates, shellcheck, and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates shellcheck python3
      - name: Shellcheck installer and E2E
        run: shellcheck --shell=sh install.sh scripts/apply-opencode-profile.sh tests/e2e/install-lifecycle.sh tests/e2e/opencode-profile.sh
      - name: Run install lifecycle E2E (sh)
        run: sh tests/e2e/install-lifecycle.sh
      - name: Run opencode profile E2E (sh)
        run: sh tests/e2e/opencode-profile.sh
      - name: Upload offline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-debian-sh
          path: TestResults/
          if-no-files-found: ignore

  # macOS: same POSIX sh contract as the Debian job.
  offline-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
      - name: Shellcheck installer and E2E
        run: shellcheck --shell=sh install.sh scripts/apply-opencode-profile.sh tests/e2e/install-lifecycle.sh tests/e2e/opencode-profile.sh
      - name: Run install lifecycle E2E (sh)
        run: sh tests/e2e/install-lifecycle.sh
      - name: Run opencode profile E2E (sh)
        run: sh tests/e2e/opencode-profile.sh
      - name: Upload offline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-diagnostics-macos-sh
          path: TestResults/
          if-no-files-found: ignore
